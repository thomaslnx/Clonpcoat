[package]
name = "clonpcoat-cli"
version = "0.1.0"
edition = "2024"
default-run = "clonpcoat"

[[bin]]
name = "clonpcoat"
path = "src/bin/clonpcoat.rs"

[[bin]]
name = "cargo-clonpcoat"
path = "src/bin/cargo_clonpcoat.rs"

[dependencies]
clap = {version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
